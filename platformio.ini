;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:esp32dev]
; Pinned deliberately, not left floating. Without a version pin,
; PlatformIO resolves "platform = espressif32" to whatever the
; current platform release is, which is how this build silently
; ended up on ESP-IDF 5.5.5 instead of the 4.4.7 every toolchain fix,
; sdkconfig option, and API call in this project (SESSION_3/4
; addenda) was actually diagnosed against. 7.0.1 is the most recent
; platform-espressif32 release that still bundles exactly ESP-IDF
; 4.4.7 (confirmed against the platform's own release notes, see
; https://github.com/platformio/platform-espressif32/releases).
; Do not remove this pin without re-validating every locked
; toolchain fix in this project against whatever version replaces it.
platform = espressif32 @ 7.0.1
board = esp32dev
framework = espidf, arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9